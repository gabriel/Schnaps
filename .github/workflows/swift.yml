name: Swift
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test measurement geometry and edge detection
        run: swift test
      - name: Build native application
        run: swift Scripts/build-app.swift
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/Schnap.app
      - uses: actions/upload-artifact@v4
        with:
          name: Schnap-macOS
          path: build/Schnap.app
