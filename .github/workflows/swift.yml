name: Swift
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - xcode: '16.4'
            runner: macos-15
          - xcode: '26.3'
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Test measurement geometry and edge detection
        run: swift test
      - name: Check release script syntax and website JavaScript
        run: |
          swiftc -typecheck Scripts/release.swift
          swiftc -swift-version 6 -typecheck Scripts/export-screenshot.swift
          node --check website/dist/site.js
      - name: Build native application
        run: swift Scripts/build-app.swift
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/Schnaps.app
      - name: Verify Sparkle embedding and release configuration
        run: |
          test -d build/Schnaps.app/Contents/Frameworks/Sparkle.framework
          test -s build/Schnaps.app/Contents/Resources/Acknowledgements/Sparkle-LICENSE.txt
          plutil -extract SUFeedURL raw build/Schnaps.app/Contents/Info.plist
          plutil -extract SUPublicEDKey raw build/Schnaps.app/Contents/Info.plist
      - name: Verify transparent icon packaging
        run: |
          test -s build/Schnaps.app/Contents/Resources/Schnaps.icns
          test ! -e build/Schnaps.app/Contents/Resources/Assets.car
      - uses: actions/upload-artifact@v4
        with:
          name: Schnaps-macOS-Xcode-${{ matrix.xcode }}
          path: build/Schnaps.app
