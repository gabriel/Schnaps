name: Swift
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        xcode: ['16.4', '26.3']
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Test measurement geometry and edge detection
        run: swift test
      - name: Build native application
        run: swift Scripts/build-app.swift
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/Schnaps.app
      - name: Verify compiled icon assets
        if: matrix.xcode == '26.3'
        run: test -s build/Schnaps.app/Contents/Resources/Assets.car
      - uses: actions/upload-artifact@v4
        with:
          name: Schnaps-macOS-Xcode-${{ matrix.xcode }}
          path: build/Schnaps.app
